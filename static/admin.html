<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111915">
<title>AirScout · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#e6efe8;--muted:#9aaba0;--green:#7bd4a1;--line:#2b3a31;--bg:#111915;--card:#19231e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 18% -12%,#20372a 0,transparent 44%),var(--bg);color:var(--ink);font:15px 'DM Sans',sans-serif}.shell{max-width:1050px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 20px;border-bottom:1px solid var(--line)}.brand{font:800 20px Manrope}.top a{color:#ccebd5;text-decoration:none}.card{margin-top:28px;padding:24px;background:linear-gradient(145deg,#1b2620,#17211c);border:1px solid var(--line);border-radius:18px}.kicker{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);font-weight:700}h1{font:700 32px Manrope;margin:8px 0}p{color:var(--muted);font-size:14px;line-height:1.7}iframe{display:block;width:100%;height:min(72vh,720px);border:1px solid #34443a;border-radius:12px;background:#141d18}@media(max-width:600px){.shell{padding:18px}.card{padding:16px}h1{font-size:26px}iframe{height:62vh}}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand">✈ AirScout · Admin</div><a href="/">Back to AirScout</a></header><main><section class="card"><div class="kicker">ADVANCED TOOL</div><h1>Google Flights sign-in</h1><p>This browser profile is used for AirScout price searches. Sign in only on Google’s page; AirScout does not collect your password.</p><iframe title="Google Flights sign-in browser" src="http://localhost:6080/vnc.html?autoconnect=1&resize=scale" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe></section></main></div></body>
</html>
